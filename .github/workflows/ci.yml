name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway credential for the SQL Server container on this ephemeral runner only. Not a secret.
      MSSQL_SA_PASSWORD: Ci_Only_Passw0rd!
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OmniCommerce.sln

      - name: Build
        run: dotnet build OmniCommerce.sln --no-restore

      # Starts API + SQL Server from docker-compose.yml, sends a real HTTP request, then runs ALL tests
      # against that SQL Server with OMNICOMMERCE_REQUIRE_SQLSERVER_TESTS=1. Exits non-zero on any failed,
      # skipped or undiscovered test (including CartApiTests and CartConcurrencyTests) or an unavailable database.
      - name: Verify (Docker Compose + full SQL Server-backed test suite)
        shell: pwsh
        run: ./scripts/verify-docker.ps1 -ResultsDirectory artifacts/test-results

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p artifacts/test-results
          docker compose logs --no-color > artifacts/test-results/compose.log 2>&1 || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Clean up Docker resources
        if: always()
        run: docker compose down --volumes --remove-orphans
